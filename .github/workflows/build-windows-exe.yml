name: Build Windows EXE

# Compila PC Optimizer como un .exe de Windows usando una maquina Windows
# real de GitHub Actions (no se puede generar un .exe valido desde Linux).
#
# Se dispara:
#   - En cada actualizacion de un Pull Request que toque pc_optimizer/,
#     para verificar que el empaquetado sigue funcionando.
#   - En cada push a main que toque pc_optimizer/.
#   - Manualmente, desde la pestana "Actions" del repo ("Run workflow").
#   - Al crear un tag "pc-optimizer-v*", ademas publica el .exe en una
#     Release de GitHub.

on:
  pull_request:
    paths:
      - "pc_optimizer/**"
      - ".github/workflows/build-windows-exe.yml"
  push:
    branches: [main]
    paths:
      - "pc_optimizer/**"
      - ".github/workflows/build-windows-exe.yml"
    tags:
      - "pc-optimizer-v*"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: pc_optimizer

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Correr las pruebas antes de empaquetar
        run: python -m unittest discover -s tests -v

      - name: Empaquetar como .exe con PyInstaller
        run: pyinstaller --onefile --windowed --name PCOptimizer main.py

      - name: Subir el .exe como artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: PCOptimizer-windows-exe
          path: pc_optimizer/dist/PCOptimizer.exe
          retention-days: 30

      - name: Publicar el .exe en una Release (solo si se creo un tag)
        if: startsWith(github.ref, 'refs/tags/pc-optimizer-v')
        uses: softprops/action-gh-release@v2
        with:
          files: pc_optimizer/dist/PCOptimizer.exe
